name: pages
# Publishes the shared build (the template's one-shot-share.sh output) to GitHub Pages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['prototypes/**', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .claude/scripts/one-shot-share.sh prototypes/both-ends
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/both-ends/dist
      - id: deployment
        uses: actions/deploy-pages@v4
